<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Freshr Studios — Buffalo's Story Studio</title>
    <meta name="description" content="Freshr Studios is Buffalo's Story Studio — cinematic storytelling for the people and places shaping the city. Documentary-style video production for small businesses, creatives, and community organizations in Buffalo, NY." />

    <!-- Theme: localStorage override → time-based fallback -->
    <!-- Random accent color per session -->
    <script>
      (function () {
        var saved = localStorage.getItem('freshr-theme');
        var h = new Date().getHours();
        var theme = saved ? saved : (h >= 6 && h < 20 ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);

        var palette = [
          { rgb: '252 158 79',  key: 'orange' },
          { rgb: '22 163 74',   key: 'green'  },
          { rgb: '196 30 58',   key: 'red'    },
          { rgb: '0 71 171',    key: 'cobalt' },
          { rgb: '124 58 237',  key: 'violet' },
          { rgb: '255 222 89',  key: 'yellow' },
        ];
        var pick = palette[Math.floor(Math.random() * palette.length)];
        document.documentElement.style.setProperty('--rgb-accent', pick.rgb);
        document.documentElement.setAttribute('data-accent', pick.key);
      })();
    </script>

    <!-- Google Fonts: Bebas Neue (display) + DM Sans (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
